# Dedicated, disposable PostgreSQL; no application database volumes or host ports.
services:
  postgres-test:
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_DB: legal_ai_test
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres-test:5432/legal_ai_test
    depends_on:
      postgres-test:
        condition: service_healthy
